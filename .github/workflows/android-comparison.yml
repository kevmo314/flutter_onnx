name: Compare Android playback on one emulator
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
          path: rtchat
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both AOT apps
        working-directory: rtchat
        run: |
          cp ../profile_playback.dart integration_test/
          flutter pub get
          flutter build apk --profile --target-platform android-x64 -t integration_test/profile_playback.dart
          cp build/app/outputs/flutter-apk/app-profile.apk "$RUNNER_TEMP/original.apk"
          rm integration_test/profile_playback.dart
          git restore --source=HEAD -- .
          git apply ../migration.patch
          python3 ../trace-graphs.py
          flutter pub get
          flutter build apk --profile --target-platform android-x64 -t integration_test/profile_playback.dart
          cp build/app/outputs/flutter-apk/app-profile.apk "$RUNNER_TEMP/migrated.apk"
          bash ../download-model.sh 3 "$RUNNER_TEMP/supertonic-3"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8192M
          script: bash compare-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-player-and-graph-timings
          path: |
            ${{ runner.temp }}/*-playback.jsonl
            ${{ runner.temp }}/graph-timings.log
