name: Measure Apple BNNS speech
on:
  push:
    paths: ['.github/workflows/bnns.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cpu:
    strategy:
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c316ea142e2c251c85d3dbc7d50aafb997af4515
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze lib hook test
      - run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare native CPU speech inference with Supertone
        env:
          HF_HUB_DISABLE_XET: '1'
          RTCHAT_REFERENCE_REV: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
        run: |
          python -m pip install supertonic==1.3.1
          curl --retry 3 -fsSL "https://raw.githubusercontent.com/muxable/rtchat/$RTCHAT_REFERENCE_REV/packages/on_device_tts/tool/supertonic_reference.py" -o "$RUNNER_TEMP/reference.py"
          dart build cli -t test/supertonic_reference.dart -o "$RUNNER_TEMP/speech-cli"
          for pack in 2:75e6727618a02f323c720cba9478152d4bc16ca4 3:3cadd1ee6394adea1bd021217a0e650ede09a323; do
            version=${pack%:*}
            model=$(python -c 'from huggingface_hub import snapshot_download; import sys; print(snapshot_download("Supertone/supertonic-" + sys.argv[1], revision=sys.argv[2], allow_patterns=["onnx/*", "voice_styles/*"]))' "$version" "${pack#*:}")
            python -I "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/reference-$version"
            "$RUNNER_TEMP/speech-cli/bundle/bin/supertonic_reference" "$RUNNER_TEMP/reference-$version"
          done
          python -I test/playback_reference.py "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/playback"
          "$RUNNER_TEMP/speech-cli/bundle/bin/supertonic_reference" --playback "$RUNNER_TEMP/playback" > "$RUNNER_TEMP/playback.log"
          cat "$RUNNER_TEMP/playback.log"
          python - "$RUNNER_TEMP/playback.log" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as report:
              rows = [json.loads(line) for line in report if line.startswith("{")]
          warm = [r for r in rows if "rtf" in r and r["round"] > 1]
          if len(warm) != 2 or any(not 0 < r["rtf"] < 1 for r in warm):
              raise SystemExit(f"Warm synthesis exceeded the real-time budget: {warm}")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: playback-profile-${{ matrix.os }}
          path: ${{ runner.temp }}/playback.log
  profile:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: c316ea142e2c251c85d3dbc7d50aafb997af4515
          path: runtime
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: 8bb611f28bf73d011df34d38c7aebf3883f611c9
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
          path: rtchat
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instrument the runtime and worker
        run: |
          git -C runtime rev-parse HEAD
          python3 instrument.py runtime
          cd rtchat
          git apply ../harness/migration.patch
          python3 ../harness/trace-graphs.py
          python3 ../capture-worker.py
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_onnx:
              path: ../runtime
            flutter_onnx_cpu:
              path: ../runtime/cpu
          EOF
          flutter pub get
          bash ../harness/download-model.sh 3 "$RUNNER_TEMP/supertonic-3"
      - name: Measure the native player and Flutter isolate
        run: bash harness/measure.sh ios
      - name: Summarize operator and process timings
        if: always()
        run: |
          file rtchat/build/ios/iphonesimulator/Runner.app/Runner
          tail -c 1300 "$RUNNER_TEMP/playback.jsonl" || true
          dir=$(xcrun simctl get_app_container booted com.rtirl.chat data)/Documents
          cp "$dir/operators.log" "$RUNNER_TEMP/operators.log"
          grep -q 'OPS denoised_latent' "$RUNNER_TEMP/operators.log"
          grep -q 'GRAPH_US vocoder.onnx' "$RUNNER_TEMP/operators.log"
          wc -l "$RUNNER_TEMP/operators.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnns-ios-operator-profile
          path: |
            ${{ runner.temp }}/operators.log
            ${{ runner.temp }}/device.log
            ${{ runner.temp }}/playback.jsonl
