name: Compare short projection layouts and padded batches
on:
  push:
    paths: ['short-products.c', '.github/workflows/short-products.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: perf/realtime-speech
          path: runtime
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compare the native and simulated Accelerate implementations
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu
          sim=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for rt,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b
          for sdk in macosx iphonesimulator; do
            opts=()
            if [[ $sdk == iphonesimulator ]]; then opts=(-target arm64-apple-ios18.0-simulator); fi
            xcrun --sdk "$sdk" clang "${opts[@]}" -O3 -ffp-contract=off -isysroot "$(xcrun --sdk "$sdk" --show-sdk-path)" short-products.c -framework Accelerate -o "$RUNNER_TEMP/bench-$sdk"
            codesign --force --sign - "$RUNNER_TEMP/bench-$sdk"
          done
          for sdk in macosx iphonesimulator; do
            echo "BENCHMARK=$sdk"
            if [[ $sdk == iphonesimulator ]]; then
              xcrun simctl spawn "$sim" "$RUNNER_TEMP/bench-$sdk" | tee "$RUNNER_TEMP/$sdk.log"
            else
              "$RUNNER_TEMP/bench-$sdk" | tee "$RUNNER_TEMP/$sdk.log"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-products
          path: ${{ runner.temp }}/*.log
