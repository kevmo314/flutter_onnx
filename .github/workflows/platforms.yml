name: Platform inference
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze lib hook test
      - run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare native CPU speech inference with Supertone
        env:
          HF_HUB_DISABLE_XET: '1'
          RTCHAT_REFERENCE_REV: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
        run: |
          python -m pip install supertonic==1.3.1
          curl --retry 3 -fsSL "https://raw.githubusercontent.com/muxable/rtchat/$RTCHAT_REFERENCE_REV/packages/on_device_tts/tool/supertonic_reference.py" -o "$RUNNER_TEMP/reference.py"
          dart build cli -t test/supertonic_reference.dart -o "$RUNNER_TEMP/speech-cli"
          for pack in 2:75e6727618a02f323c720cba9478152d4bc16ca4 3:3cadd1ee6394adea1bd021217a0e650ede09a323; do
            version=${pack%:*}
            model=$(python -c 'from huggingface_hub import snapshot_download; import sys; print(snapshot_download("Supertone/supertonic-" + sys.argv[1], revision=sys.argv[2], allow_patterns=["onnx/*", "voice_styles/*"]))' "$version" "${pack#*:}")
            python -I "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/reference-$version"
            "$RUNNER_TEMP/speech-cli/bundle/bin/supertonic_reference" "$RUNNER_TEMP/reference-$version"
          done
          python -I test/playback_reference.py "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/playback"
          "$RUNNER_TEMP/speech-cli/bundle/bin/supertonic_reference" --playback "$RUNNER_TEMP/playback" > "$RUNNER_TEMP/playback.log"
          cat "$RUNNER_TEMP/playback.log"
          python - "$RUNNER_TEMP/playback.log" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as report:
              rows = [json.loads(line) for line in report if line.startswith("{")]
          warm = [r for r in rows if "rtf" in r and r["round"] > 1]
          if len(warm) != 2 or any(not 0 < r["rtf"] < 1 for r in warm):
              raise SystemExit(f"Warm synthesis exceeded the real-time budget: {warm}")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: playback-profile-${{ matrix.os }}
          path: ${{ runner.temp }}/playback.log
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true
      - run: dart pub get
      - run: dart analyze lib test tool
      - run: dart test -p vm
      - run: dart test -p chrome
      - run: flutter pub get
        working-directory: example
      - run: flutter pub get && flutter analyze lib
        working-directory: accelerators
      - run: flutter analyze lib test integration_test
        working-directory: example
      - run: flutter build web
        working-directory: example
      - name: Exercise WebGPU with Chromium's software Vulkan adapter
        working-directory: example
        run: |
          cat > "$RUNNER_TEMP/chrome-gpu" <<'SH'
          #!/bin/sh
          exec google-chrome --enable-unsafe-webgpu --enable-unsafe-swiftshader --use-angle=swiftshader "$@"
          SH
          chmod +x "$RUNNER_TEMP/chrome-gpu"
          CHROME_EXECUTABLE="$RUNNER_TEMP/chrome-gpu" flutter test --platform chrome --dart-define=REQUIRE_WEBGPU=true test
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install onnx==1.23.2 onnxruntime==1.32.0 numpy
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug --dart-define=VERIFY_LARGE_MODELS=true --target integration_test/platform_check.dart
        working-directory: example
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ram-size: 4096M
          script: |
            cd example && bash ../tool/check_mobile.sh android
            python tool/verify_models.py --cache "$RUNNER_TEMP/models" --device android qwen_q4 qwen3_q4
            python tool/opset_conformance.py --device android --strict --baseline tool/conformance-baseline.txt --report android-opset.json
            cd example && flutter test --no-pub integration_test -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-opset-28
          path: android-opset*.json
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install onnx==1.23.2 onnxruntime==1.32.0 numpy
      - name: Prepare the iPhone simulator
        working-directory: example
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for rt,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          echo "IOS_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          flutter pub get
          flutter build ios --simulator --debug --dart-define=VERIFY_LARGE_MODELS=true --target integration_test/platform_check.dart
      - name: Run bundled iOS inference checks
        working-directory: example
        run: bash ../tool/check_mobile.sh ios "$IOS_SIMULATOR"
      - name: Compare Qwen2.5 and Qwen3 on iOS
        run: python tool/verify_models.py --cache "$RUNNER_TEMP/models" --device "$IOS_SIMULATOR" qwen_q4 qwen3_q4
      - name: Check all opset 28 operators on iOS
        run: python tool/opset_conformance.py --device "$IOS_SIMULATOR" --strict --baseline tool/conformance-baseline.txt --report ios-opset.json
      - name: Run Flutter integration tests with XCTest
        working-directory: example
        run: |
          results="$RUNNER_TEMP/ios-tests"
          mkdir -p "$results"
          find integration_test -name '*_test.dart' -type f | sort > "$results/targets"
          test -s "$results/targets"
          while IFS= read -r target; do
            flutter build ios --config-only --simulator --debug --target "$target"
            bundle="$results/${target%.dart}.xcresult"
            mkdir -p "$(dirname "$bundle")"
            status=0
            xcodebuild -quiet -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Debug -destination "id=$IOS_SIMULATOR" -parallel-testing-enabled NO \
              -resultBundlePath "$bundle" test || status=$?
            xcrun xcresulttool get test-results summary --path "$bundle" | tee "$bundle.json"
            if ((status != 0)); then exit "$status"; fi
            jq -e '.passedTests > 0 and .failedTests == 0' "$bundle.json"
          done < "$results/targets"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-xctest-results
          path: ${{ runner.temp }}/ios-tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-opset-28
          path: ios-opset*.json
