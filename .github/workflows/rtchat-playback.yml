name: Measure RTChat playback
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  playback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        engine: [migrated]
        include:
          - os: macos-15
            engine: original
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
          path: rtchat
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
      - name: Prepare RTChat and the pinned model
        working-directory: rtchat
        run: |
          if [[ "${{ matrix.engine }}" = migrated ]]; then
            git apply ../migration.patch
          else
            cp ../profile_playback.dart integration_test/
            # The original source has disappeared. This mirror revision changes only
            # the archive URLs and preserves Microsoft's source and both binary hashes.
            python3 - <<'PYTHON'
          from pathlib import Path
          for p in Path('packages/on_device_tts/ios').rglob('Package.swift'):
              s = p.read_text()
              p.write_text(s.replace('microsoft/onnxruntime-swift-package-manager", exact: "1.24.2', 'thesagezm/onnxruntime-swift-package-manager", revision: "7dbd851c52a6e3889077f69dda8c9f8f438b60ab'))
          PYTHON
          fi
          flutter pub get
          bash ../download-model.sh 3 "$RUNNER_TEMP/supertonic-3"
      - name: Build the profiling APK
        if: runner.os == 'Linux'
        working-directory: rtchat
        run: |
          flutter build apk --profile --target-platform android-x64 -t integration_test/profile_playback.dart
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure Android AudioTrack playback
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8192M
          script: bash measure.sh android
      - name: Measure iOS AVAudioEngine playback
        if: runner.os == 'macOS'
        run: bash measure.sh ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/playback.jsonl
            ${{ runner.temp }}/device.log
