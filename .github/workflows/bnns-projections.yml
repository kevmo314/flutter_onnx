name: Compare batched BNNS projections
on:
  push:
    paths: ['.github/workflows/bnns-projections.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cpu:
    strategy:
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c316ea142e2c251c85d3dbc7d50aafb997af4515
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze lib hook test
      - run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare native CPU speech inference with Supertone
        env:
          HF_HUB_DISABLE_XET: '1'
          RTCHAT_REFERENCE_REV: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
        run: |
          python -m pip install supertonic==1.3.1
          curl --retry 3 -fsSL "https://raw.githubusercontent.com/muxable/rtchat/$RTCHAT_REFERENCE_REV/packages/on_device_tts/tool/supertonic_reference.py" -o "$RUNNER_TEMP/reference.py"
          model=$(python -c 'from huggingface_hub import snapshot_download; print(snapshot_download("Supertone/supertonic-3", revision="3cadd1ee6394adea1bd021217a0e650ede09a323", allow_patterns=["onnx/*", "voice_styles/*"]))')
          python -I "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/reference"
          python -I test/playback_reference.py "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/playback"
          for mode in batched contract expand; do
            git restore lib/flutter_onnx_cpu.dart
            python3 - "$mode" <<'PYTHON'
          import sys
          from pathlib import Path
          predicate={"batched":"batch > 1", "contract":"batch > 1 && !gelu && channels >= filters", "expand":"batch > 1 && gelu && filters > channels"}[sys.argv[1]]
          file=Path("lib/flutter_onnx_cpu.dart")
          text=file.read_text()
          assert text.count("filters >= 128 &&") == 1
          file.write_text(text.replace("filters >= 128 &&", f"({predicate}) && filters >= 128 &&"))
          PYTHON
            dart build cli -t test/supertonic_reference.dart -o "$RUNNER_TEMP/$mode"
            for workload in reference playback; do
              args=("$RUNNER_TEMP/$workload")
              if [[ "$workload" == playback ]]; then args=(--playback "${args[@]}"); fi
              echo "CONFIG=$mode workload=$workload"
              if ! "$RUNNER_TEMP/$mode/bundle/bin/supertonic_reference" "${args[@]}"; then echo "Validation failed for $mode ($workload)"; fi
            done
          done
