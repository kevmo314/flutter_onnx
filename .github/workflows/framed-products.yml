name: Verify frame-major speech contractions
on:
  push:
    paths: ['.github/workflows/framed-products.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cpu:
    strategy:
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 494488a6f5bfdcc192c04443c4315fc864f57bc6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze lib hook test
      - run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare native CPU speech inference with Supertone
        env:
          HF_HUB_DISABLE_XET: '1'
          RTCHAT_REFERENCE_REV: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
        run: |
          python -m pip install supertonic==1.3.1
          curl --retry 3 -fsSL "https://raw.githubusercontent.com/muxable/rtchat/$RTCHAT_REFERENCE_REV/packages/on_device_tts/tool/supertonic_reference.py" -o "$RUNNER_TEMP/reference.py"
          dart build cli -t test/supertonic_reference.dart -o "$RUNNER_TEMP/speech-cli"
          for pack in 2:75e6727618a02f323c720cba9478152d4bc16ca4 3:3cadd1ee6394adea1bd021217a0e650ede09a323; do
            version=${pack%:*}
            model=$(python -c 'from huggingface_hub import snapshot_download; import sys; print(snapshot_download("Supertone/supertonic-" + sys.argv[1], revision=sys.argv[2], allow_patterns=["onnx/*", "voice_styles/*"]))' "$version" "${pack#*:}")
            python -I "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/reference-$version"
            "$RUNNER_TEMP/speech-cli/bundle/bin/supertonic_reference" "$RUNNER_TEMP/reference-$version"
          done
          python -I test/playback_reference.py "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/playback"
          "$RUNNER_TEMP/speech-cli/bundle/bin/supertonic_reference" --playback "$RUNNER_TEMP/playback" > "$RUNNER_TEMP/playback.log"
          cat "$RUNNER_TEMP/playback.log"
          python - "$RUNNER_TEMP/playback.log" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as report:
              rows = [json.loads(line) for line in report if line.startswith("{")]
          warm = [r for r in rows if "rtf" in r and r["round"] > 1]
          if len(warm) != 2 or any(not 0 < r["rtf"] < 1 for r in warm):
              raise SystemExit(f"Warm synthesis exceeded the real-time budget: {warm}")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: playback-profile-${{ matrix.os }}
          path: ${{ runner.temp }}/playback.log
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 44fc55c6c246488500517b0527f149e88c02b24f
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: 494488a6f5bfdcc192c04443c4315fc864f57bc6
          path: runtime
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the pinned app and independent reference
        run: |
          curl --retry 3 -fsSL https://raw.githubusercontent.com/kevmo314/flutter_onnx/912fe690797954b3a510b365a38b985f07111a7f/migration.patch -o "$RUNNER_TEMP/migration.patch"
          git apply "$RUNNER_TEMP/migration.patch"
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_onnx: {path: runtime}
            flutter_onnx_cpu: {path: runtime/cpu}
          EOF
          flutter pub get
          flutter analyze --no-pub integration_test/profile_playback.dart integration_test/on_device_tts_test.dart
          python -m pip install supertonic==1.3.1
          export MODEL_DIR="$RUNNER_TEMP/supertonic-3"
          echo "MODEL_DIR=$MODEL_DIR" >> "$GITHUB_ENV"
          bash .github/scripts/download-supertonic.sh 3 "$MODEL_DIR"
          python -I packages/on_device_tts/tool/supertonic_reference.py "$MODEL_DIR" "$RUNNER_TEMP/reference"
      - name: Prepare Android emulator
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/prepare-supertonic-android.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android waveform and playback tests
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8192M
          script: bash .github/scripts/test-supertonic-device.sh android
      - name: Run iOS waveform and playback tests
        if: runner.os == 'macOS'
        run: bash .github/scripts/test-supertonic-device.sh ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrated-rtchat-${{ matrix.os }}
          path: ${{ runner.temp }}/playback-*.jsonl
