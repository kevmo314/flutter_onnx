name: Profile Apple speech kernels
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: d685353c1b657a586106d6844abe2e5c281a7155
          path: runtime
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate identical input and reference tensors
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m pip install supertonic==1.3.1
          curl --retry 3 -fsSL https://raw.githubusercontent.com/muxable/rtchat/6bac5c59d7b593030a7c98ff9b37ae712fdb35ed/packages/on_device_tts/tool/supertonic_reference.py -o "$RUNNER_TEMP/reference.py"
          model=$(python -c 'from huggingface_hub import snapshot_download; print(snapshot_download("Supertone/supertonic-3", revision="3cadd1ee6394adea1bd021217a0e650ede09a323", allow_patterns=["onnx/*", "voice_styles/*"]))')
          python -I runtime/cpu/test/playback_reference.py "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/playback"
          python -I "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/corpus"
      - name: Compare graph time and waveform error
        working-directory: runtime
        run: |
          sysctl -n machdep.cpu.brand_string
          (cd cpu && dart pub get)
          for kernel in baseline large-accelerate packed; do
            git restore cpu/lib/flutter_onnx_cpu.dart cpu/src/matmul.c
            if [[ "$kernel" != baseline ]]; then python ../compare.py "$kernel"; fi
            (cd cpu && dart build cli -t test/supertonic_reference.dart -o "$RUNNER_TEMP/$kernel")
            cli="$RUNNER_TEMP/$kernel/bundle/bin/supertonic_reference"
            echo "KERNEL=$kernel"
            "$cli" --playback "$RUNNER_TEMP/playback" || echo "Playback parity failed for $kernel"
            "$cli" "$RUNNER_TEMP/corpus" || echo "Corpus parity failed for $kernel"
          done
