name: Profile Flutter speech operators
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: 026e7e0f3b4b721f0cad0d556e04aafd361c8226
          path: runtime
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate timed five-step reference inputs
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m pip install supertonic==1.3.1
          curl --retry 3 -fsSL https://raw.githubusercontent.com/muxable/rtchat/6bac5c59d7b593030a7c98ff9b37ae712fdb35ed/packages/on_device_tts/tool/supertonic_reference.py -o "$RUNNER_TEMP/reference.py"
          model=$(python -c 'from huggingface_hub import snapshot_download; print(snapshot_download("Supertone/supertonic-3", revision="3cadd1ee6394adea1bd021217a0e650ede09a323", allow_patterns=["onnx/*", "voice_styles/*"]))')
          python -I runtime/cpu/test/playback_reference.py "$RUNNER_TEMP/reference.py" "$model" "$RUNNER_TEMP/playback"
      - name: Profile the Flutter debug engine
        run: |
          python instrument.py runtime
          cd runtime/cpu
          flutter pub get
          SPEECH_ROOT="$RUNNER_TEMP/playback" flutter test test/operator_profile_test.dart --reporter expanded > "$RUNNER_TEMP/profile.log"
          grep -E '^(OPS|\{"round")' "$RUNNER_TEMP/profile.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-debug-operator-profile
          path: ${{ runner.temp }}/profile.log
