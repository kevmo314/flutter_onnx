name: Profile RTChat iOS operators
on:
  push:
    paths: ['instrument.py', '.github/workflows/ios-operators.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: 999405e48362ab27dc0dc8291c5d0691338e3e4a
          path: runtime
      - uses: actions/checkout@v4
        with:
          repository: kevmo314/flutter_onnx
          ref: 02cc5bafb0979455194eadccc6c9a7ac637db014
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 44fc55c6c246488500517b0527f149e88c02b24f
          path: rtchat
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instrument the runtime and worker
        run: |
          git -C runtime rev-parse HEAD
          python3 instrument.py runtime
          python3 stages.py
          cd rtchat
          git apply ../harness/migration.patch
          python3 ../harness/trace-graphs.py
          python3 ../capture-worker.py
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_onnx:
              path: ../runtime
            flutter_onnx_cpu:
              path: ../runtime/cpu
          EOF
          flutter pub get
          bash ../harness/download-model.sh 3 "$RUNNER_TEMP/supertonic-3"
      - name: Measure the native player and Flutter isolate
        working-directory: rtchat
        run: |
          sim=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for k,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b
          MODEL_DIR="$RUNNER_TEMP/supertonic-3" bash .github/scripts/profile-supertonic-device.sh ios "$sim"
      - name: Summarize operator and process timings
        if: always()
        run: |
          file rtchat/build/ios/iphonesimulator/Runner.app/Runner
          tail -c 1300 "$RUNNER_TEMP/playback-ios.jsonl" || true
          dir=$(xcrun simctl get_app_container booted com.rtirl.chat data)/Documents
          cp "$dir/native-stages.log" "$RUNNER_TEMP/native-stages.log"
          cp "$dir/operators.log" "$RUNNER_TEMP/operators.log"
          grep -q 'OPS denoised_latent' "$RUNNER_TEMP/operators.log"
          grep -q 'GRAPH_US vocoder.onnx' "$RUNNER_TEMP/operators.log"
          wc -l "$RUNNER_TEMP/operators.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-operator-profile
          path: |
            ${{ runner.temp }}/native-stages.log
            ${{ runner.temp }}/operators.log
            ${{ runner.temp }}/device.log
            ${{ runner.temp }}/playback-ios.jsonl
