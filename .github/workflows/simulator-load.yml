name: Profile iPhone simulator startup load
on:
  push:
    paths: ['.github/workflows/simulator-load.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Record host load before and after booting iOS
        run: |
          xcrun simctl list runtimes
          sim=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for rt,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds if d["name"].startswith("iPhone")))')
          sysctl -n hw.ncpu machdep.cpu.brand_string
          top -l 1 -n 10 -stats pid,command,cpu,time
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b
          for i in {1..16}; do
            date -u
            top -l 2 -s 1 -n 15 -o cpu -stats pid,command,cpu,time | tail -22
            sleep 14
          done
