name: Check iOS projection waveforms and throughput
on:
  push:
    paths: ['.github/workflows/mobile-projections.yml', 'mobile-oracle.dart']
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c316ea142e2c251c85d3dbc7d50aafb997af4515
          path: runtime
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
          path: rtchat
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one app with selectable Apple projections and generate Python references
        working-directory: rtchat
        run: |
          curl --retry 3 -fsSL https://raw.githubusercontent.com/kevmo314/flutter_onnx/aef71a8ed3f89a1d1127684dd4db32d5da9bbdaf/migration.patch -o "$RUNNER_TEMP/app.patch"
          git apply "$RUNNER_TEMP/app.patch"
          cp ../mobile-oracle.dart integration_test/mobile_oracle.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('../runtime/cpu/lib/flutter_onnx_cpu.dart')
          s=p.read_text()
          assert s.count('filters >= 128 &&') == 1
          s=s.replace('class NativeCpuBackend implements ChannelwiseBackend {', "class NativeCpuBackend implements ChannelwiseBackend {\n  static String projectionMode = 'baseline';")
          worker=Path('packages/on_device_tts/lib/src/onnx/graph_worker.dart')
          code=worker.read_text()
          anchor='  final graph = OnnxSession.fromBytes'
          assert code.count(anchor)==1
          worker.write_text(code.replace(anchor,"  NativeCpuBackend.projectionMode = File('${File(path).parent.parent.parent.path}/projection-mode').readAsStringSync().trim();\n"+anchor))
          p.write_text(s.replace('    if ((Platform.isIOS || Platform.isMacOS)', '''    final matches = switch (NativeCpuBackend.projectionMode) {
                'all' => true,
                'batched' => batch > 1,
                'contract' => batch > 1 && !gelu && channels >= filters,
                'expand' => batch > 1 && gelu && filters > channels,
                _ => false,
              };
              if (matches && (Platform.isIOS || Platform.isMacOS)'''))
          PY
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_onnx: {path: ../runtime}
            flutter_onnx_cpu: {path: ../runtime/cpu}
          EOF
          flutter pub get
          sim=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for rt,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds if d["name"].startswith("iPhone")))')
          echo "SIM=$sim" >> "$GITHUB_ENV"
          xcrun simctl boot "$sim"
          python -m pip install supertonic==1.3.1
          bash .github/scripts/download-supertonic.sh 3 "$RUNNER_TEMP/supertonic-3"
          python -I packages/on_device_tts/tool/supertonic_reference.py "$RUNNER_TEMP/supertonic-3" "$RUNNER_TEMP/reference"
          xcrun simctl bootstatus "$sim" -b
          flutter build ios --debug --simulator -t integration_test/mobile_oracle.dart
          xcrun simctl install "$sim" build/ios/iphonesimulator/Runner.app
      - name: Compare fresh PCM sample by sample, then profile conforming variants
        run: |
          docs=$(xcrun simctl get_app_container "$SIM" com.rtirl.chat data)/Documents
          mkdir -p "$docs" "$RUNNER_TEMP/result"
          cp -R "$RUNNER_TEMP/supertonic-3" "$RUNNER_TEMP/reference" "$docs/"
          # Capture the simulator and build services competing with inference.
          (while true; do date -u; ps -A -o pcpu=,pid=,comm= | sort -nr | head -15 || true; sleep 15; done) > "$RUNNER_TEMP/result/processes.log" &
          monitor=$!
          trap 'kill "$monitor" || true' EXIT
          for mode in contract all batched expand baseline; do
            rm -f "$docs/oracle.jsonl" "$docs/playback.jsonl"
            echo "$mode" > "$docs/projection-mode"
            xcrun simctl launch --terminate-running-process --stdout="$RUNNER_TEMP/result/$mode-stdout.log" --stderr="$RUNNER_TEMP/result/$mode-stderr.log" "$SIM" com.rtirl.chat
            for ((i=0; i<100; ++i)); do
              if grep -Eq '"complete":true|"error":' "$docs/oracle.jsonl" 2>/dev/null; then break; fi
              if ((i % 12 == 0)); then tail -3 "$docs/oracle.jsonl" || true; fi
              sleep 5
            done
            cp "$docs/oracle.jsonl" "$RUNNER_TEMP/result/$mode-oracle.jsonl"
            cat "$docs/oracle.jsonl"
            if [[ -f "$docs/playback.jsonl" ]]; then
              cp "$docs/playback.jsonl" "$RUNNER_TEMP/result/$mode-playback.jsonl"
              cat "$docs/playback.jsonl"
            fi
            grep -q '"complete":true' "$docs/oracle.jsonl"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-correctness-and-speed
          path: ${{ runner.temp }}/result
