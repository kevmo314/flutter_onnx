name: Verify migrated RTChat on mobile
on:
  push:
    paths: ['.github/workflows/rtchat-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 6bac5c59d7b593030a7c98ff9b37ae712fdb35ed
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the pinned app and independent reference
        run: |
          curl --retry 3 -fsSL https://raw.githubusercontent.com/kevmo314/flutter_onnx/0f660215b664e17dabd08f109ea3b109c0269ea8/migration.patch -o "$RUNNER_TEMP/migration.patch"
          git apply "$RUNNER_TEMP/migration.patch"
          flutter pub get
          python -m pip install supertonic==1.3.1
          export MODEL_DIR="$RUNNER_TEMP/supertonic-3"
          echo "MODEL_DIR=$MODEL_DIR" >> "$GITHUB_ENV"
          bash .github/scripts/download-supertonic.sh 3 "$MODEL_DIR"
          python -I packages/on_device_tts/tool/supertonic_reference.py "$MODEL_DIR" "$RUNNER_TEMP/reference"
      - name: Prepare Android emulator
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android waveform and playback tests
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8192M
          script: bash .github/scripts/test-supertonic-device.sh android
      - name: Run iOS waveform and playback tests
        if: runner.os == 'macOS'
        run: bash .github/scripts/test-supertonic-device.sh ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrated-rtchat-${{ matrix.os }}
          path: ${{ runner.temp }}/playback-*.jsonl
