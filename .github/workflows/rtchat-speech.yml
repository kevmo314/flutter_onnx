name: RTChat mobile speech
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: rtchat-speech-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  synthesis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 44fc55c6c246488500517b0527f149e88c02b24f
          path: rtchat
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
      - name: Prepare the migrated app with the runtime under test
        working-directory: rtchat
        run: |
          curl --retry 3 -fsSL https://raw.githubusercontent.com/kevmo314/flutter_onnx/bea28831e0ca00e564ae9f42a86ec52d3672ff07/migration.patch -o "$RUNNER_TEMP/rtchat.patch"
          git apply "$RUNNER_TEMP/rtchat.patch"
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_onnx:
              path: ..
            flutter_onnx_cpu:
              path: ../cpu
          EOF
          flutter pub get
          bash .github/scripts/download-supertonic.sh 3 "$RUNNER_TEMP/supertonic-3"
          echo "MODEL_DIR=$RUNNER_TEMP/supertonic-3" >> "$GITHUB_ENV"
      - name: Prepare Android profile build
        if: runner.os == 'Linux'
        working-directory: rtchat
        run: |
          flutter build apk --profile --target-platform android-x64 -t integration_test/profile_playback.dart
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Profile Android synthesis and playback
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8192M
          script: cd rtchat && bash .github/scripts/profile-supertonic-device.sh android "$(adb get-serialno)"
      - name: Profile iOS synthesis and playback
        if: runner.os == 'macOS'
        working-directory: rtchat
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(d["udid"] for r, devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in r for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bash .github/scripts/profile-supertonic-device.sh ios "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtchat-playback-${{ matrix.os }}
          path: ${{ runner.temp }}/playback-*.jsonl
