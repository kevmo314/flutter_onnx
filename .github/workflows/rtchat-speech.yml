name: RTChat mobile speech
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: rtchat-playback-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  synthesis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: muxable/rtchat
          ref: 44fc55c6c246488500517b0527f149e88c02b24f
          path: rtchat
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
      - name: Prepare the migrated app with the runtime under test
        working-directory: rtchat
        run: |
          curl --retry 3 -fsSL https://raw.githubusercontent.com/kevmo314/flutter_onnx/3e53338c9b849d1a50c3dbc1dad0fa8d190745e5/migration.patch -o "$RUNNER_TEMP/rtchat.patch"
          git apply "$RUNNER_TEMP/rtchat.patch"
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_onnx:
              path: ..
            flutter_onnx_cpu:
              path: ../cpu
          EOF
          flutter pub get
          flutter analyze --no-pub integration_test/profile_playback.dart integration_test/on_device_tts_test.dart
      - name: Prepare Android profile build
        if: runner.os == 'Linux'
        working-directory: rtchat
        run: |
          bash .github/scripts/download-supertonic.sh 3 "$RUNNER_TEMP/supertonic-3"
          echo "MODEL_DIR=$RUNNER_TEMP/supertonic-3" >> "$GITHUB_ENV"
          bash .github/scripts/prepare-supertonic-android.sh
          flutter build apk --profile --target-platform android-x64 -t integration_test/profile_playback.dart
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Profile Android synthesis and playback
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8192M
          script: cd rtchat && bash .github/scripts/profile-supertonic-device.sh android "$(adb get-serialno)"
      - name: Build iOS app for the playback benchmark
        if: runner.os == 'macOS'
        working-directory: rtchat
        run: |
          flutter build ios --simulator --debug -t integration_test/profile_playback.dart
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/ios-playback.tar" \
            -C "$PWD/build/ios/iphonesimulator" Runner.app \
            -C "$PWD/.github/scripts" download-supertonic.sh profile-supertonic-device.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ios-playback-app
          path: ${{ runner.temp }}/ios-playback.tar
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: rtchat-playback-ubuntu-latest
          path: ${{ runner.temp }}/playback-android.jsonl

  ios-playback:
    needs: synthesis
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: ios-playback-app
          path: ${{ runner.temp }}
      - name: Profile iOS synthesis and playback on a fresh simulator host
        working-directory: ${{ runner.temp }}
        run: |
          tar -xf ios-playback.tar
          export MODEL_DIR="$RUNNER_TEMP/supertonic-3"
          bash download-supertonic.sh 3 "$MODEL_DIR"
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [rt for rt, models in devices.items() if ".iOS-" in rt and any(d["name"].startswith("iPhone") for d in models)]
          latest = max(runtimes, key=lambda rt: tuple(map(int, rt.split(".iOS-")[1].split("-"))))
          iphone = next(d for d in devices[latest] if d["name"].startswith("iPhone"))
          print(iphone["name"], latest, file=sys.stderr)
          print(iphone["udid"])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bash profile-supertonic-device.sh ios "$device" "$RUNNER_TEMP/Runner.app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtchat-playback-macos-26
          path: ${{ runner.temp }}/playback-ios.jsonl
